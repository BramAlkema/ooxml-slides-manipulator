name: Live Apps Script Integration

on:
  workflow_dispatch:

jobs:
  live-integration:
    name: Live deployment tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GAS_PROJECT_URL: ${{ secrets.GAS_PROJECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Require the live deployment URL
        run: test -n "$GAS_PROJECT_URL"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test the live Apps Script deployment
        run: npm run test:live
